[package]
name = "cc-watch"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
native-tls = "0.2"   # already pulled in by tungstenite; used directly so the TLS handshake can time out
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "native-tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
