<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackChan preview</title>
<style>
  body { background:#1d1d1f; color:#eee; font:14px -apple-system, system-ui, sans-serif; margin:24px; }
  .robot { width:320px; height:240px; background:#000; border-radius:12px; overflow:hidden; position:relative;
           box-shadow:0 0 0 10px #333; margin:30px auto 16px; }
  .face { height:96px; display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:700; color:#000; }
  .rows { padding:0 10px; }
  .row { display:flex; justify-content:space-between; font-size:13px; padding:3px 4px; border-radius:4px; }
  .row.needs_you { background:#5a1400; } .row.needs_you.long { background:#5a3400; } .say { text-align:center; padding:6px 10px; font-size:13px; } .row .state { opacity:.85; } .more { font-size:12px; opacity:.6; text-align:right; padding-right:8px; }
  .leds { display:flex; gap:6px; justify-content:center; margin:8px; }
  .led { width:16px; height:16px; border-radius:50%; background:#222; }
  .flash .led { background:#ff2d2d; animation:blink .5s infinite; } .orange_flash .led { background:#ff8a1f; animation:blink .5s infinite; }
  .rainbow .led { background:#ff2d2d; animation:hue 9s linear infinite; }
  .green .led { background:#30d158; } .dim_white .led { background:#666; }
  @keyframes blink { 50% { opacity:.15; } } @keyframes hue { to { filter:hue-rotate(360deg); } }
  .meta { text-align:center; opacity:.6; } button { margin:4px; }
</style></head>
<body>
<div class="robot"><div class="face" id="face">😴</div><div class="say" id="say"></div><div class="rows" id="rows"></div></div>
<div class="leds" id="leds"></div>
<div class="meta" id="meta">connecting…</div>
<div class="meta"><button data-g="tap">tap (ack)</button><button data-g="double_tap">double tap row 1 (focus)</button><button data-g="long_press">long press (quiet)</button></div>
<script>
const FACES = { needs_you:"😰", still_waiting:"😬", working:"🧐", just_finished:"😄", all_done:"🙂", none:"😴" };
const BG = { needs_you:"#E8380D", still_waiting:"#F28A0C", working:"linear-gradient(135deg,#fa0505,#fafa05,#05fa05,#05fafa,#0505fa,#fa05fa)", just_finished:"#F2D40A", all_done:"#2F9BFF", none:"#18244A" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const leds = document.getElementById("leds"); leds.innerHTML = '<div class="led"></div>'.repeat(12);
const q = new URLSearchParams(location.search).get("token");
const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/cc/preview/ws${q ? "?token=" + encodeURIComponent(q) : ""}`);
const ago = ms => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + "s" : Math.round(s / 60) + "m"; };
ws.onmessage = ev => {
  const d = JSON.parse(ev.data);
  document.getElementById("face").textContent = (d.big ? d.big[0] + " " : "") + (FACES[d.mood] || "🙂");
  document.getElementById("face").style.background = BG[d.mood] || "#000";
  // The sentence the robot shows: its first cycling row, or the server's "spot" sentence.
  const want = d.mood === "working" ? "working" : "needs_you", r0 = d.rows.find(r => r.state === want && !d.spot);
  document.getElementById("say").innerHTML = r0 ? `<b>${esc(r0.name || r0.project)}</b>${esc(r0.say)}<br>${esc(r0.what || r0.ask.slice(r0.cut))}`
    : d.spot ? `<b>${esc(d.spot.bold)}</b>${esc(d.spot.text)}<br>${esc(d.spot.sub)}` : "";
  leds.className = "leds " + d.leds;
  document.getElementById("rows").innerHTML = d.rows.map(r =>
    `<div class="row ${r.state}${r.waitingLong ? " long" : ""}"><span>${r.ghostty ? "▣" : "□"} ${esc(r.project)} · ${esc(r.name)}${r.offline ? " (offline)" : ""}</span><span class="state">${esc(r.detail)} ${ago(r.since)}</span></div>`
  ).join("") + (d.more ? `<div class="more">+${d.more} more</div>` : "");
  document.getElementById("meta").textContent = `mood: ${d.mood} · leds: ${d.leds} · sessions: ${d.count}${d.chime ? " · 🔔 CHIME" : ""}`;
};
ws.onclose = () => document.getElementById("meta").textContent = "disconnected";
document.querySelectorAll("button").forEach(b => b.onclick = () => ws.send(JSON.stringify({ type:"touch", gesture:b.dataset.g, row:0 })));
</script>
</body></html>
